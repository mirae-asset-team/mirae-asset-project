<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>미래에셋 공시 에이전트</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="대화 기록">
        <button id="new-chat" type="button">새 대화</button>
        <label for="history-search">대화 검색</label>
        <input id="history-search" type="search" autocomplete="off" placeholder="대화 검색">
        <ol id="conversation-list"></ol>
        <button id="clear-history" class="secondary-button" type="button">대화 기록 전체 삭제</button>
      </aside>
      <main class="chat" aria-labelledby="app-title">
        <header class="chat-header">
          <div>
            <h1 id="app-title">미래에셋 공시 에이전트</h1>
            <p>공시를 근거로 기업 정보를 검색하고 설명합니다.</p>
          </div>
          <p id="service-status" role="status" aria-live="polite">서버 상태 확인 중</p>
        </header>
        <ol id="messages" class="messages" aria-live="polite"></ol>
        <form id="question-form" class="question-form">
          <label class="sr-only" for="question-input">공시 질문</label>
          <textarea id="question-input" maxlength="4000" required placeholder="기업 공시에 관해 질문해 보세요."></textarea>
          <button id="send-question" type="submit">질문하기</button>
        </form>
      </main>
    </div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
