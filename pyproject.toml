[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miraeasset-disclosure-db"
version = "0.1.0"
description = "Reproducible disclosure corpus inventory, parsing, lineage, and quality pipeline"
requires-python = ">=3.11"
dependencies = [
  "lxml>=6.1,<7",
  "PyMuPDF>=1.28,<2",
]

[project.optional-dependencies]
pdf-audit = ["pdfplumber>=0.11,<1"]

[project.scripts]
disclosure-db = "disclosure_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

