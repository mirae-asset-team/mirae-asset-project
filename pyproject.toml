[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "miraeasset-disclosure-db"
version = "0.2.0"
description = "Reproducible disclosure corpus inventory, parsing, lineage, and quality pipeline"
requires-python = ">=3.11"
dependencies = [
  "lxml>=6.1,<7",
  "PyMuPDF>=1.28,<2",
]

[project.optional-dependencies]
pdf-audit = ["pdfplumber>=0.11,<1"]
agent = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
bge-m3-pilot = [
  "faiss-cpu>=1.8,<2",
  "numpy>=1.26,<3",
  "sentence-transformers>=3.4,<6",
]
dense = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy==2.5.2",
  "faiss-cpu==1.15.0",
  "FlagEmbedding==1.4.2",
]

[project.scripts]
disclosure-db = "disclosure_db.cli:main"
disclosure-agent = "disclosure_db.cli:agent_main"
disclosure-dense = "disclosure_db.dense_runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disclosure_db = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/fonts/*.woff2",
  "web/fonts/LICENSE.md",
]
