name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Validate JSON contracts
        run: |
          python -m json.tool config/evaluation_contract.json >/dev/null
          python -m json.tool config/gold_annotation_schema.json >/dev/null
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
