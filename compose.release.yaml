name: mirae-release

x-agent-environment: &agent-environment
  DISCLOSURE_BASE_DB: /data/base/disclosure.sqlite
  DISCLOSURE_OVERLAY_DB: /data/agent/agent_overlay.sqlite
  DISCLOSURE_SEARCH_DB: /data/agent/agent_search.sqlite
  DISCLOSURE_ATTESTATION: /data/attestation.json
  DISCLOSURE_DENSE_URL: http://dense-retriever:8080
  DISCLOSURE_DENSE_TIMEOUT_SECONDS: ${DISCLOSURE_DENSE_TIMEOUT_SECONDS:-5}
  DISCLOSURE_DENSE_VECTOR_COUNT: ${DISCLOSURE_DENSE_VECTOR_COUNT:-2571506}
  DISCLOSURE_DENSE_ADOPTION_ARTIFACT: /runtime/dense_adoption.json
  DISCLOSURE_DENSE_EVALUATION_SUMMARY: /app/data/derived/freeform_retrieval_summary.json
  CLOVASTUDIO_API_KEY: ${CLOVASTUDIO_API_KEY:-}
  CLOVASTUDIO_BASE_URL: ${CLOVASTUDIO_BASE_URL:-https://clovastudio.stream.ntruss.com/v1/openai}
  CLOVASTUDIO_MODEL: ${CLOVASTUDIO_MODEL:-HCX-005}
  RELEASE_IMAGE_ID: ${DISCLOSURE_EXPECTED_IMAGE_ID:-}
  RELEASE_BASE_SHA256: ${DISCLOSURE_EXPECTED_BASE_SHA256:-}
  RELEASE_OVERLAY_SHA256: ${DISCLOSURE_EXPECTED_OVERLAY_SHA256:-}
  RELEASE_SEARCH_INDEX_SHA256: ${DISCLOSURE_EXPECTED_SEARCH_INDEX_SHA256:-}

x-agent-volumes: &agent-volumes
  - type: bind
    source: /srv/mirae/data/base/disclosure.sqlite
    target: /data/base/disclosure.sqlite
    read_only: true
  - type: bind
    source: /srv/mirae/data/agent/agent_overlay.sqlite
    target: /data/agent/agent_overlay.sqlite
    read_only: true
  - type: bind
    source: /srv/mirae/data/agent/agent_search.sqlite
    target: /data/agent/agent_search.sqlite
    read_only: true
  - type: bind
    source: /srv/mirae/data/attestation.json
    target: /data/attestation.json
    read_only: true
  - type: bind
    source: /srv/mirae/runtime
    target: /runtime

services:
  dense-retriever:
    image: "${DISCLOSURE_DENSE_IMAGE:-mirae-dense-retriever:latest}"
    restart: unless-stopped
    environment:
      DENSE_INDEX_PATH: /data/dense/index.faiss
      DENSE_METADATA_PATH: /data/dense/chunk_metadata.jsonl
      DENSE_MANIFEST_PATH: /data/dense/manifest.json
      DENSE_OFFSETS_PATH: /runtime/dense_metadata.offsets.u64
      DENSE_FILING_INDEX_PATH: /runtime/dense_filing_vectors.sqlite
      DENSE_MODEL_PATH: /model
      DENSE_RUNTIME_MANIFEST_PATH: /runtime/dense_runtime_manifest.json
    volumes:
      - type: bind
        source: /srv/mirae/data/dense
        target: /data/dense
        read_only: true
      - type: bind
        source: /srv/mirae/data/model/bge-m3
        target: /model
        read_only: true
      - type: bind
        source: /srv/mirae/runtime
        target: /runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health'))['ready']"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

  disclosure-agent-staging:
    image: "${DISCLOSURE_RELEASE_IMAGE:?DISCLOSURE_RELEASE_IMAGE must identify the tested image}"
    restart: unless-stopped
    ports: ["8001:8000"]
    environment:
      <<: *agent-environment
      DISCLOSURE_PUBLIC_RATE_PER_MINUTE: ${DISCLOSURE_STAGING_RATE_PER_MINUTE:-120}
      DISCLOSURE_PUBLIC_PER_IP_CONCURRENCY: ${DISCLOSURE_STAGING_PER_IP_CONCURRENCY:-20}
      DISCLOSURE_PUBLIC_GLOBAL_CONCURRENCY: ${DISCLOSURE_STAGING_GLOBAL_CONCURRENCY:-20}
      EVAL_ENABLED: "1"
      EVAL_CASES_PATH: /app/eval/qa_cases.jsonl
      EVAL_RESULTS_DIR: /app/eval/qa_results
      RELEASE_COMMIT: ${DISCLOSURE_EXPECTED_COMMIT:?DISCLOSURE_EXPECTED_COMMIT is required}
    volumes: *agent-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); assert data['ready'] and data['eval_enabled']"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s

  disclosure-agent:
    image: "${DISCLOSURE_RELEASE_IMAGE:?DISCLOSURE_RELEASE_IMAGE must identify the tested image}"
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      <<: *agent-environment
      DISCLOSURE_PUBLIC_RATE_PER_MINUTE: ${DISCLOSURE_PUBLIC_RATE_PER_MINUTE:-120}
      DISCLOSURE_PUBLIC_PER_IP_CONCURRENCY: ${DISCLOSURE_PUBLIC_PER_IP_CONCURRENCY:-4}
      DISCLOSURE_PUBLIC_GLOBAL_CONCURRENCY: ${DISCLOSURE_PUBLIC_GLOBAL_CONCURRENCY:-8}
      RELEASE_COMMIT: ${DISCLOSURE_EXPECTED_COMMIT:?DISCLOSURE_EXPECTED_COMMIT is required}
    volumes: *agent-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['ready']"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s
