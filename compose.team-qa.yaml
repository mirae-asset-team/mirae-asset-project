services:
  dense-retriever:
    image: mirae-dense-retriever:latest
    build:
      context: .
      dockerfile: Dockerfile.dense
    restart: unless-stopped
    environment:
      DENSE_INDEX_PATH: /data/dense/index.faiss
      DENSE_METADATA_PATH: /data/dense/chunk_metadata.jsonl
      DENSE_MANIFEST_PATH: /data/dense/manifest.json
      DENSE_OFFSETS_PATH: /runtime/dense_metadata.offsets.u64
      DENSE_FILING_INDEX_PATH: /runtime/dense_filing_vectors.sqlite
      DENSE_MODEL_PATH: /model
    volumes:
      - "${DISCLOSURE_DENSE_DIR_HOST}:/data/dense:ro"
      - "${DISCLOSURE_DENSE_MODEL_HOST}:/model:ro"
      - "${DISCLOSURE_RUNTIME_DIR_HOST}:/runtime"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health'))['ready']"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

  team-qa:
    image: mirae-team-qa:latest
    build: .
    restart: unless-stopped
    environment:
      DISCLOSURE_BASE_DB: /data/base/disclosure.sqlite
      DISCLOSURE_OVERLAY_DB: /data/agent/agent_overlay.sqlite
      DISCLOSURE_SEARCH_DB: /data/agent/agent_search.sqlite
      DISCLOSURE_ATTESTATION: /data/attestation.json
      DISCLOSURE_QA_DB: /runtime/qa_lab.sqlite
      DISCLOSURE_DENSE_URL: http://dense-retriever:8080
      CLOVASTUDIO_API_KEY: ${CLOVASTUDIO_API_KEY:-}
      CLOVASTUDIO_MODEL: ${CLOVASTUDIO_MODEL:-HCX-007}
      DISCLOSURE_PUBLIC_RATE_PER_MINUTE: ${DISCLOSURE_PUBLIC_RATE_PER_MINUTE:-120}
      DISCLOSURE_PUBLIC_PER_IP_CONCURRENCY: ${DISCLOSURE_PUBLIC_PER_IP_CONCURRENCY:-4}
      DISCLOSURE_PUBLIC_GLOBAL_CONCURRENCY: ${DISCLOSURE_PUBLIC_GLOBAL_CONCURRENCY:-8}
    volumes:
      - "${DISCLOSURE_BASE_DB_HOST}:/data/base/disclosure.sqlite:ro"
      - "${DISCLOSURE_AGENT_DB_DIR_HOST}:/data/agent:ro"
      - "${DISCLOSURE_ATTESTATION_HOST}:/data/attestation.json:ro"
      - "${DISCLOSURE_RUNTIME_DIR_HOST}:/runtime"
    depends_on:
      dense-retriever:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health'))['ready']"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 180s

  public-gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DISCLOSURE_QA_HOST: ${DISCLOSURE_QA_HOST:?set DISCLOSURE_QA_HOST}
      DISCLOSURE_QA_PASSWORD_HASH: ${DISCLOSURE_QA_PASSWORD_HASH:?set DISCLOSURE_QA_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile.team-qa:/etc/caddy/Caddyfile:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    depends_on:
      team-qa:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
